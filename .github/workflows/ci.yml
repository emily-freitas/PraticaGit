name: CI - Verificação Completa

# Quando o CI vai rodar
on:
  pull_request:
    branches: [ "main", "dev" ]
    types: [opened, synchronize, reopened]
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Permite rodar manualmente

# O que cada job faz
jobs:
  
  # JOB 1: Verificar arquivos
  verificacao-basica:
    name: 📋 Verificação Básica
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4
      
      - name: 📂 Listar estrutura do projeto
        run: |
          echo "## Estrutura do Projeto" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -laR >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: 📝 Verificar README.md
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ README.md é obrigatório!"
            exit 1
          fi
          echo "✅ README.md existe"
      
      - name: 🔍 Verificar arquivos grandes
        run: |
          find . -type f -size +1M -not -path "./.git/*" | while read file; do
            echo "⚠️ Arquivo grande detectado: $file"
          done

  # JOB 2: Verificar qualidade do código (se tiver arquivos de código)
  verificacao-codigo:
    name: 🔧 Verificação de Código
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Baixar código
        uses: actions/checkout@v4
      
      - name: 🔍 Verificar arquivos Python
        run: |
          if ls *.py 1> /dev/null 2>&1; then
            echo "🐍 Arquivos Python encontrados"
            # Aqui você pode adicionar: pip install flake8 && flake8 *.py
          else
            echo "ℹ️ Nenhum arquivo Python encontrado"
          fi
      
      - name: 🔍 Verificar arquivos JavaScript
        run: |
          if ls *.js 1> /dev/null 2>&1; then
            echo "📜 Arquivos JavaScript encontrados"
            # Aqui você pode adicionar: node -c *.js
          else
            echo "ℹ️ Nenhum arquivo JavaScript encontrado"
          fi

  # JOB 3: Relatório final
  relatorio:
    name: 📊 Gerar Relatório
    runs-on: ubuntu-latest
    needs: [verificacao-basica, verificacao-codigo]
    if: always()
    
    steps:
      - name: ✅ Resumo da execução
        run: |
          echo "## 🎯 Resultado do CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação Básica | ${{ needs.verificacao-basica.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verificação de Código | ${{ needs.verificacao-codigo.result }} |" >> $GITHUB_STEP_SUMMARY